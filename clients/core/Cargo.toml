[package]
name = "openkache-client-core"
version = "0.1.0"
edition.workspace = true
description = "Low-level client core for the OpenKache cache server"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/openkache/openkache"
homepage = "https://openkache.com"
documentation = "https://docs.rs/openkache-client-core"
keywords = ["cache", "client", "quic", "tls", "openkache"]
categories = ["network-programming", "database"]
rust-version = "1.85"
include = [
    "Cargo.toml",
    "*.md",
    "LICENSE",
    "build.rs",
    "include/**",
    "src/**/*.rs",
]

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["quic-quinn"]
ffi = ["quic-compio", "tls-tcp"]
quic-compio = ["dep:compio", "dep:compio-quic"]
quic-quinn = ["dep:quinn", "dep:tokio"]
tls-tcp = ["dep:tokio", "dep:tokio-rustls"]

[dependencies]
# Exact direct feature dependencies clear the AEAD key schedules and MAC state.
aes = { version = "=0.9.1", features = ["zeroize"] }
aes-gcm-siv = { version = "=0.12.0-rc.3", features = ["zeroize"] }
aes-siv = { version = "=0.8.0-rc.3", features = ["zeroize"] }
base64 = "*"
blake3 = { version = "*", features = ["zeroize"] }
cmac = { version = "=0.8.0", features = ["zeroize"] }
compio = { version = "*", default-features = false, features = ["io-uring", "net", "runtime", "time"], optional = true }
compio-quic = { version = "*", features = ["ring"], optional = true }
crossfire = "*"
futures-util = "*"
# `fill` is the 0.3 API; older registry releases only expose `getrandom`.
getrandom = "0.3"
http = "*"
openkache-protocol = { version = "*", path = "../../protocol" }
openkache-value = { version = "*", path = "../value" }
polyval = { version = "=0.7.3", features = ["zeroize"] }
quinn = { version = "*", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
rustls = { version = "*", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rustls-native-certs = "*"
serde = "*"
serde_json = "*"
serde_json_canonicalizer = "*"
smallvec = "*"
thiserror = "*"
tokio = { version = "*", features = ["io-util", "net", "rt", "time"], optional = true }
tokio-rustls = { version = "*", default-features = false, optional = true }
vu128 = "*"
zeroize = { version = "*", features = ["derive"] }
zstd-pure-rs = "*"
