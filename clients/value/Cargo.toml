[package]
name = "openkache-value"
publish = false
version = "0.1.0"
edition.workspace = true
description = "Owned cross-language value model and StructuredValue-CBOR-v1 codec"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/openkache/openkache"
homepage = "https://openkache.com"
documentation = "https://docs.rs/openkache-value"
keywords = ["cache", "cbor", "value", "openkache"]
categories = ["encoding", "data-structures"]
rust-version = "1.85"
include = [
    "Cargo.toml",
    "*.md",
    "LICENSE",
    "src/**/*.rs",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
thiserror = "*"
