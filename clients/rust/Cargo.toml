[package]
name = "openkache-client"
version = "0.1.0"
edition = "2024"
description = "Ergonomic Rust client for the OpenKache cache server"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["quic-quinn"]
ffi = ["quic-compio", "dep:compio", "dep:flume"]
quic-compio = ["openkache-client-core/quic-compio"]
quic-quinn = ["openkache-client-core/quic-quinn"]

[dependencies]
compio = { version = "*", default-features = false, features = ["runtime"], optional = true }
flume = { version = "*", optional = true }
futures-util = "*"
openkache-client-core = { path = "../core", default-features = false }
