[package]
name = "openkache"
publish = true
version = "0.1.1"
edition.workspace = true
description = "Rust client for the OpenKache cache server"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/openkache/openkache"
homepage = "https://openkache.com"
documentation = "https://docs.rs/openkache"
keywords = ["cache", "client", "quic", "tls", "openkache"]
categories = ["network-programming", "database"]
rust-version = "1.85"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**/*.rs", "examples/**/*.rs"]

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib"]

[features]
default = ["quic-quinn"]
quic-quinn = ["dep:quinn", "dep:tokio"]
quic-compio = ["dep:compio", "dep:compio-quic"]

[dependencies]
aes = { version = "=0.9.1", features = ["zeroize"] }
aes-gcm-siv = { version = "=0.12.0-rc.3", features = ["zeroize"] }
aes-siv = { version = "=0.8.0-rc.3", features = ["zeroize"] }
base64 = "=0.22.1"
blake3 = { version = "=1.8.5", features = ["zeroize"] }
cmac = { version = "=0.8.0", features = ["zeroize"] }
compio = { version = "*", default-features = false, features = ["io-uring", "net", "runtime", "time"], optional = true }
compio-quic = { version = "*", features = ["ring"], optional = true }
crossbeam-queue = "=0.3.13"
crossfire = "=3.1.19"
futures-util = "=0.3.33"
getrandom = "0.3"
http = "=1.5.0"
polyval = { version = "=0.7.3", features = ["zeroize"] }
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rustls-native-certs = "=0.8.4"
serde = "=1.0.229"
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
smallvec = { version = "=1.15.2", features = ["const_new"] }
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["io-util", "net", "rt", "time", "macros", "rt-multi-thread"], optional = true }
vu128 = "=1.1.0"
zeroize = { version = "=1.9.0", features = ["derive"] }
zstd-pure-rs = "=0.1.2"
