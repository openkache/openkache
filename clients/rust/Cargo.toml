[package]
name = "openkache-client"
version = "0.1.0"
edition = "2024"
description = "Rust client for the OpenKache cache server"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
ffi = []

[dependencies]
chacha20poly1305 = { version = "*", features = ["zeroize"] }
compio = { version = "*", default-features = false, features = ["io-uring", "net", "runtime"] }
compio-quic = { version = "*", features = ["ring"] }
getrandom = "*"
openkache-protocol = { path = "../../protocol" }
rustls = { version = "*", default-features = false, features = ["ring", "std"] }
thiserror = "*"
zeroize = "*"
zstd-pure-rs = "*"
