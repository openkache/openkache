[package]
name = "openkache"
publish = true
version = "0.1.1"
edition.workspace = true
description = "Rust client for the OpenKache cache server"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/openkache/openkache"
homepage = "https://openkache.com"
documentation = "https://docs.rs/openkache"
keywords = ["cache", "client", "quic", "tls", "openkache"]
categories = ["network-programming", "database"]
rust-version = "1.85"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**/*.rs", "examples/**/*.rs"]

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib"]

[features]
default = ["quic-quinn"]
quic-quinn = ["dep:quinn", "dep:tokio"]

[dependencies]
aes = { version = "=0.9.1", features = ["zeroize"] }
aes-gcm-siv = { version = "=0.12.0-rc.3", features = ["zeroize"] }
aes-siv = { version = "=0.8.0-rc.3", features = ["zeroize"] }
base64 = "*"
blake3 = { version = "*", features = ["zeroize"] }
cmac = { version = "=0.8.0", features = ["zeroize"] }
crossbeam-queue = "=0.3.13"
crossfire = "=3.1.19"
futures-util = "=0.3.33"
getrandom = "0.3"
http = "*"
polyval = { version = "=0.7.3", features = ["zeroize"] }
quinn = { version = "*", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
rustls = { version = "*", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rustls-native-certs = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_json_canonicalizer = "*"
smallvec = { version = "*", features = ["const_new"] }
thiserror = "*"
tokio = { version = "*", features = ["io-util", "net", "rt", "time", "macros", "rt-multi-thread"], optional = true }
vu128 = "*"
zeroize = { version = "*", features = ["derive"] }
zstd-pure-rs = "*"
