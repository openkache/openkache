[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openkache"
version = "0.1.1"
description = "Python client for the OpenKache cache server"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "OpenKache Team" }]
keywords = ["cache", "openkache", "ssd"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/openkache/openkache"
Documentation = "https://github.com/openkache/openkache/tree/main/clients/python"
Repository = "https://github.com/openkache/openkache"
Issues = "https://github.com/openkache/openkache/issues"

[tool.setuptools.package-data]
openkache = ["LICENSE", "py.typed", "*.dll", "*.dylib", "*.so", "_generated/*.py"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
