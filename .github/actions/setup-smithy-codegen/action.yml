name: Set up Smithy code generation
description: Installs pinned Bun and Smithy CLI versions for source generation

runs:
  using: composite
  steps:
    - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        distribution: temurin
        java-version: "21"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.13
    - name: Install Smithy CLI
      shell: bash
      env:
        SMITHY_ARCHIVE_SHA256: ee6e6d24416b53624ba7f323628b2ca8aa67a349fbe3b2e92e98172c3f3d6a45
        SMITHY_VERSION: 1.68.0
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/smithy-cli.zip"
        destination="${RUNNER_TEMP}/smithy-cli"
        curl --fail --location --silent --show-error \
          "https://github.com/smithy-lang/smithy/releases/download/${SMITHY_VERSION}/smithy-cli-linux-x86_64.zip" \
          --output "${archive}"
        printf '%s  %s\n' "${SMITHY_ARCHIVE_SHA256}" "${archive}" | sha256sum --check
        mkdir -p "${destination}"
        (
          cd "${destination}"
          jar xf "${archive}"
        )
        chmod +x "${destination}/smithy-cli-linux-x86_64/bin/smithy"
        printf '%s\n' "${destination}/smithy-cli-linux-x86_64/bin" >> "${GITHUB_PATH}"
        printf 'OPENKACHE_SMITHY_EXECUTABLE=%s\n' \
          "${destination}/smithy-cli-linux-x86_64/bin/smithy" >> "${GITHUB_ENV}"
