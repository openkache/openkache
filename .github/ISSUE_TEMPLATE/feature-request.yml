name: Feature request
description: Propose a user-facing capability or compatibility improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Proposals should account for the
        current preview support boundary and compatibility contracts.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Who needs this, and what cannot they do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs did you consider?

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and operational impact
      description: Note wire/API compatibility, storage-format changes, security implications, and resource costs.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make this request complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched the existing issues for duplicates.
          required: true
        - label: I have separated the requested outcome from a specific implementation.
          required: true
