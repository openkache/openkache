name: Release OpenKache Rust client crate

# Releases are deliberately manual. Dispatch this workflow from the exact
# client-v<version> tag only after the protected crates-io-release environment
# has approved the run and configured the CARGO_REGISTRY_TOKEN secret.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Rust crate to release"
        required: true
        type: choice
        options:
          - client
      version:
        description: "Stable crate version copied from the selected Cargo.toml"
        required: true
        type: string
      confirm:
        description: 'Type RELEASE to build and publish this immutable version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-${{ inputs.package }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_PACKAGE: ${{ inputs.package }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CONFIRM: ${{ inputs.confirm }}

jobs:
  guard:
    name: Verify tag, version, and clean source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Reject an unconfirmed or mismatched release
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${RELEASE_PACKAGE}" in
            client)
              expected_tag_prefix="client"
              manifest_path="clients/rust/Cargo.toml"
              crate_name="openkache"
              ;;
            *)
              echo "Package must be client." >&2
              exit 1
              ;;
          esac
          if [[ "${RELEASE_CONFIRM}" != "RELEASE" ]]; then
            echo "The confirmation input must be exactly RELEASE." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be a stable three-part SemVer value." >&2
            exit 1
          fi
          expected_tag="${expected_tag_prefix}-v${RELEASE_VERSION}"
          if [[ "${SOURCE_REF_TYPE}" != "tag" || "${SOURCE_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Dispatch this workflow from ${expected_tag}; got ${SOURCE_REF_TYPE}:${SOURCE_REF_NAME}." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${expected_tag}^{commit}")" != "${SOURCE_SHA}" ]]; then
            echo "The selected tag does not resolve to the workflow commit." >&2
            exit 1
          fi
          crate_version="$(
            cargo metadata --manifest-path "${manifest_path}" --no-deps --format-version 1 |
              jq -r --arg crate_name "${crate_name}" '.packages[] | select(.name == $crate_name) | .version'
          )"
          if [[ "${crate_version}" != "${RELEASE_VERSION}" ]]; then
            echo "${manifest_path} version does not match the release input." >&2
            exit 1
          fi
          if ! registry_status="$(
            curl --silent --show-error --location --retry 2 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              --user-agent "openkache-release/${crate_name}/${RELEASE_VERSION}" \
              --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/${crate_name}/${RELEASE_VERSION}"
          )"; then
            echo "Could not query crates.io for ${crate_name}@${RELEASE_VERSION}." >&2
            echo "Why: crates.io versions are immutable and publication cannot safely continue without proving this version is unused." >&2
            echo "Fix: restore crates.io registry access, then rerun the release guard." >&2
            exit 1
          fi
          case "${registry_status}" in
            404)
              ;;
            200)
              echo "${crate_name}@${RELEASE_VERSION} already exists on crates.io." >&2
              echo "Why: crates.io versions are immutable and cannot be overwritten." >&2
              echo "Fix: choose the next unused version, update the manifest and its ${expected_tag_prefix}-v<version> tag, then rerun the workflow." >&2
              exit 1
              ;;
            *)
              echo "crates.io returned HTTP ${registry_status} while checking ${crate_name}@${RELEASE_VERSION}." >&2
              echo "Why: the release guard could not prove that the immutable version is available." >&2
              echo "Fix: investigate crates.io registry access and rerun the workflow; do not bypass this guard." >&2
              exit 1
              ;;
          esac
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "The release checkout is dirty; refusing to continue." >&2
            exit 1
          fi

  package:
    name: Build and inspect crate archive
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Verify crate metadata and package archive
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${RELEASE_PACKAGE}" in
            client)
              manifest_path="clients/rust/Cargo.toml"
              crate_name="openkache"
              ;;
            *)
              echo "Package must be client." >&2
              exit 1
              ;;
          esac
          crate_version="$(
            cargo metadata --manifest-path "${manifest_path}" --no-deps --format-version 1 |
              jq -r --arg crate_name "${crate_name}" '.packages[] | select(.name == $crate_name) | .version'
          )"
          if [[ "${crate_version}" != "${RELEASE_VERSION}" ]]; then
            echo "${manifest_path} version does not match the release input." >&2
            exit 1
          fi
          cargo package --manifest-path "${manifest_path}" --locked
          crate_path="target/package/${crate_name}-${RELEASE_VERSION}.crate"
          [[ -s "${crate_path}" ]] || {
            echo "cargo package did not produce ${crate_path}." >&2
            exit 1
          }
          tar -tzf "${crate_path}" | grep -Fx "${crate_name}-${RELEASE_VERSION}/Cargo.toml"
          tar -tzf "${crate_path}" | grep -F "${crate_name}-${RELEASE_VERSION}/src/lib.rs"
          release_root="${RUNNER_TEMP}/${crate_name}-crate"
          mkdir -p "${release_root}"
          cp "${crate_path}" "${release_root}/"
          printf 'source_commit=%s\nsource_tag=%s\npackage_version=%s\ncrate_name=%s\n' \
            "${SOURCE_SHA}" "${SOURCE_REF_NAME}" "${RELEASE_VERSION}" "${crate_name}" \
            > "${release_root}/RELEASE-METADATA"
          (
            cd "${release_root}"
            sha256sum "${crate_name}-${RELEASE_VERSION}.crate" > SHA256SUMS
          )

      - name: Upload crate archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openkache-${{ inputs.package }}-crate
          path: ${{ runner.temp }}/openkache-crate
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable crates.io version
    needs: [guard, package]
    runs-on: ubuntu-24.04
    environment: crates-io-release
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Download crate archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openkache-${{ inputs.package }}-crate
          path: ${{ runner.temp }}/openkache-${{ inputs.package }}-crate

      - name: Verify provenance and exact crate before publication
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${RELEASE_PACKAGE}" in
            client)
              manifest_path="clients/rust/Cargo.toml"
              crate_name="openkache"
              ;;
            *)
              echo "Package must be client." >&2
              exit 1
              ;;
          esac
          release_root="${RUNNER_TEMP}/openkache-${RELEASE_PACKAGE}-crate"
          crate_file="${crate_name}-${RELEASE_VERSION}.crate"
          downloaded_crate="${release_root}/${crate_file}"
          expected_metadata="${RUNNER_TEMP}/${crate_name}-expected-metadata"
          printf 'source_commit=%s\nsource_tag=%s\npackage_version=%s\ncrate_name=%s\n' \
            "${SOURCE_SHA}" "${SOURCE_REF_NAME}" "${RELEASE_VERSION}" "${crate_name}" \
            > "${expected_metadata}"
          if ! cmp -s "${expected_metadata}" "${release_root}/RELEASE-METADATA"; then
            echo "Downloaded crate metadata does not match the checked-out release tag." >&2
            diff -u "${expected_metadata}" "${release_root}/RELEASE-METADATA" >&2 || true
            exit 1
          fi
          (
            cd "${release_root}"
            sha256sum --check SHA256SUMS
            [[ -s "${crate_file}" ]]
          )
          crate_version="$(
            cargo metadata --manifest-path "${manifest_path}" --no-deps --format-version 1 |
              jq -r --arg crate_name "${crate_name}" '.packages[] | select(.name == $crate_name) | .version'
          )"
          if [[ "${crate_version}" != "${RELEASE_VERSION}" ]]; then
            echo "${manifest_path} version does not match the release input." >&2
            exit 1
          fi
          if ! registry_status="$(
            curl --silent --show-error --location --retry 2 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              --user-agent "openkache-release/${crate_name}/${RELEASE_VERSION}" \
              --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/${crate_name}/${RELEASE_VERSION}"
          )"; then
            echo "Could not query crates.io for ${crate_name}@${RELEASE_VERSION}." >&2
            echo "Why: crates.io versions are immutable and publication cannot safely continue without proving this version is unused." >&2
            echo "Fix: restore crates.io registry access, then rerun the publication preflight." >&2
            exit 1
          fi
          case "${registry_status}" in
            404)
              ;;
            200)
              echo "${crate_name}@${RELEASE_VERSION} already exists on crates.io." >&2
              echo "Why: crates.io versions are immutable and cannot be overwritten." >&2
              echo "Fix: choose the next unused version and create a matching release tag before retrying." >&2
              exit 1
              ;;
            *)
              echo "crates.io returned HTTP ${registry_status} while checking ${crate_name}@${RELEASE_VERSION}." >&2
              echo "Why: the publication preflight could not prove that the immutable version is available." >&2
              echo "Fix: investigate crates.io registry access and rerun the workflow; do not bypass this guard." >&2
              exit 1
              ;;
          esac
          # cargo publish repackages the checkout; prove its deterministic
          # archive matches the staged artifact before allowing publication.
          rm -rf target/package
          cargo package --manifest-path "${manifest_path}" --locked
          recreated_crate="target/package/${crate_file}"
          [[ -s "${recreated_crate}" ]] || {
            echo "cargo package did not recreate ${crate_file}." >&2
            exit 1
          }
          tar -tzf "${recreated_crate}" | grep -Fx "${crate_name}-${RELEASE_VERSION}/Cargo.toml"
          tar -tzf "${recreated_crate}" | grep -F "${crate_name}-${RELEASE_VERSION}/src/lib.rs"
          downloaded_sha256="$(sha256sum "${downloaded_crate}" | cut -d ' ' -f 1)"
          recreated_sha256="$(sha256sum "${recreated_crate}" | cut -d ' ' -f 1)"
          if [[ "${recreated_sha256}" != "${downloaded_sha256}" ]]; then
            echo "The release tag recreated a different crate archive than the downloaded artifact." >&2
            echo "Downloaded SHA-256: ${downloaded_sha256}" >&2
            echo "Recreated SHA-256: ${recreated_sha256}" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "The publish checkout is dirty; refusing to continue." >&2
            exit 1
          fi

      - name: Publish to crates.io
        run: |
          set -euo pipefail
          cargo publish --manifest-path clients/rust/Cargo.toml --locked --token "${CARGO_REGISTRY_TOKEN}"
