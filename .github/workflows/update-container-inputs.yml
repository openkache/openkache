name: Update container toolchain pins

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-container-inputs
  cancel-in-progress: true

jobs:
  update:
    name: Update Nix flake lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Update and verify locked Nix inputs
        run: |
          builder_image="$(sed -n 's/^FROM \(nixos\/nix:[^ ]*\) AS builder$/\1/p' server/Dockerfile)"
          if ! printf '%s\n' "${builder_image}" | grep -Eq '^nixos/nix:[^@[:space:]]+@sha256:[0-9a-f]{64}$'; then
            printf 'Invalid pinned builder image: %s\n' "${builder_image}" >&2
            exit 1
          fi
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/server \
            "${builder_image}" \
            sh -euxc '
              git config --global --add safe.directory /workspace
              if ! nix --extra-experimental-features "nix-command flakes" \
                flake update nixpkgs rust-overlay; then
                printf "Nix input update failed before the cache probe.\n" >&2
                printf "Why: the workflow must produce a complete candidate lock before checking its package closures.\n" >&2
                printf "Fix: repair the flake inputs or network access, then rerun the update workflow.\n" >&2
                exit 1
              fi
              check_cache() {
                system="$1"
                reference=".#packages.${system}.nixpkgs-cache-check"
                if ! dry_run="$(nix --extra-experimental-features "nix-command flakes" \
                  build --dry-run --json --accept-flake-config --no-update-lock-file "$reference")"; then
                  printf "Nix cache probe could not evaluate the %s container package set.\n" "$system" >&2
                  printf "Why: the update must prove that the container inputs can be substituted before opening a PR.\n" >&2
                  printf "Fix: repair server/flake.nix or server/flake.lock, then rerun the update workflow.\n" >&2
                  exit 1
                fi
                uncached_derivations="$(
                  printf "%s\n" "$dry_run" \
                    | grep -oE "/nix/store/[^\"]+\.drv" \
                    | grep -v -- "-openkache-container-nixpkgs-cache-check\.drv$" \
                    || true
                )"
                if [ -n "$uncached_derivations" ]; then
                  printf "Uncached Nix derivations for %s would be built:\n%s\n" \
                    "$system" "$uncached_derivations" >&2
                  printf "Why: container input updates must not make publication compile an uncached Nixpkgs package.\n" >&2
                  printf "Fix: pin a Nixpkgs revision whose outputs are available from cache.nixos.org.\n" >&2
                  exit 1
                fi
                if ! cache_paths_json="$(
                  nix --extra-experimental-features "nix-command flakes" \
                    eval --json --accept-flake-config --no-update-lock-file "${reference}.cachePaths" \
                )"; then
                  printf "Nix cache probe could not enumerate the %s container package paths.\n" "$system" >&2
                  printf "Why: the update must inspect every package selected by the candidate lock.\n" >&2
                  printf "Fix: repair server/flake.nix or server/flake.lock, then rerun the update workflow.\n" >&2
                  exit 1
                fi
                cache_paths="$(
                  printf "%s\n" "$cache_paths_json" \
                    | tr -d "[]" \
                    | tr "," "\n" \
                    | tr -d "\""
                )"
                if [ -n "$cache_paths" ]; then
                  if ! nix path-info --recursive --store https://cache.nixos.org $cache_paths >/dev/null; then
                    printf "cache.nixos.org does not contain every %s container package closure.\n" "$system" >&2
                    printf "Why: a local Nix store could hide a missing substitute and make publication build locally.\n" >&2
                    printf "Fix: pin a Nixpkgs revision whose container package outputs are published to cache.nixos.org.\n" >&2
                    exit 1
                  fi
                fi
              }
              check_cache x86_64-linux
              check_cache aarch64-linux
            '

      - name: Open update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7769d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(container): 🔧 update Nix container inputs"
          branch: automation/update-container-inputs
          delete-branch: true
          title: "chore(container): 🔧 update Nix container inputs"
          body: |
            Updates the locked nixpkgs and rust-overlay revisions and content hashes used by `server/container.nix`.

            The container publication workflow will build this change for both supported image architectures.
