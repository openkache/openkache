name: Update container toolchain pins

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-container-inputs
  cancel-in-progress: true

jobs:
  update:
    name: Update Nix flake lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Update and verify locked Nix inputs
        uses: ./.github/actions/check-container-nix-cache
        with:
          update: "true"

      - name: Open update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7769d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(container): 🔧 update Nix container inputs"
          branch: automation/update-container-inputs
          delete-branch: true
          title: "chore(container): 🔧 update Nix container inputs"
          body: |
            Updates the locked nixpkgs and rust-overlay revisions and content hashes used by `server/container.nix`.

            The container publication workflow will build this change for both supported image architectures.
