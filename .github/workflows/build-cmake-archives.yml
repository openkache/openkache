name: Build C and C++ CMake archives

# This workflow creates reviewable source archives and never publishes a
# registry release. Dispatch it from the exact cmake-v<version> tag after the
# protected cmake-release environment has approved the run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable CMake client version in clients/c and clients/cpp"
        required: true
        type: string
      confirm:
        description: 'Type RELEASE to build the immutable source archives'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cmake-clients-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CONFIRM: ${{ inputs.confirm }}

jobs:
  guard:
    name: Verify tag, versions, and clean source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject an unconfirmed or mismatched release
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_CONFIRM}" != "RELEASE" ]]; then
            echo "The confirmation input must be exactly RELEASE." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be a stable three-part SemVer value." >&2
            exit 1
          fi
          expected_tag="cmake-v${RELEASE_VERSION}"
          if [[ "${SOURCE_REF_TYPE}" != "tag" || "${SOURCE_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Dispatch this workflow from ${expected_tag}; got ${SOURCE_REF_TYPE}:${SOURCE_REF_NAME}." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${expected_tag}^{commit}")" != "${SOURCE_SHA}" ]]; then
            echo "The selected tag does not resolve to the workflow commit." >&2
            exit 1
          fi
          c_version="$(
            sed -nE 's/^project\(openkache_client_c VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
              clients/c/CMakeLists.txt
          )"
          cpp_version="$(
            sed -nE 's/^project\(openkache_client_cpp VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
              clients/cpp/CMakeLists.txt
          )"
          if [[ "${c_version}" != "${RELEASE_VERSION}" || "${cpp_version}" != "${RELEASE_VERSION}" ]]; then
            echo "C and C++ CMake project versions must match the release input." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "The release checkout is dirty; refusing to continue." >&2
            exit 1
          fi

  package:
    name: Build and inspect CMake source archives
    needs: guard
    runs-on: ubuntu-24.04
    environment: cmake-release
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-smithy-codegen

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install Clang/LLVM toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm

      - name: Generate the locked client notice
        run: |
          set -euo pipefail
          cargo fetch --locked
          bun install --cwd scripts --frozen-lockfile --production
          notice_root="${RUNNER_TEMP}/openkache-cmake-notice"
          mkdir -p "${notice_root}"
          ./scripts/generate-third-party-notices.ts \
            --artifact cmake \
            --output "${notice_root}/THIRD-PARTY-NOTICES.txt"

      - name: Build the native core used by the CMake packages
        run: |
          set -euo pipefail
          cargo build --manifest-path Cargo.toml \
            -p openkache-client-core --no-default-features --features ffi \
            --release --locked
          test -s "${GITHUB_WORKSPACE}/target/release/libopenkache_client_core.a"

      - name: Run C and C++ CMake configure/build smoke checks
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP}/openkache-cmake-smoke"
          mkdir -p "${smoke_root}"
          native_core="${GITHUB_WORKSPACE}/target/release/libopenkache_client_core.a"
          notice_path="${RUNNER_TEMP}/openkache-cmake-notice/THIRD-PARTY-NOTICES.txt"
          cmake -S clients/c -B "${smoke_root}/c-build" \
            -DOPENKACHE_CLIENT_NATIVE_LIBRARY_STATIC="${native_core}" \
            -DOPENKACHE_CLIENT_THIRD_PARTY_NOTICES="${notice_path}"
          cmake --build "${smoke_root}/c-build"
          cmake -S clients/cpp -B "${smoke_root}/cpp-build" \
            -DOPENKACHE_CLIENT_NATIVE_LIBRARY_STATIC="${native_core}" \
            -DOPENKACHE_CLIENT_THIRD_PARTY_NOTICES="${notice_path}"
          cmake --build "${smoke_root}/cpp-build"
          install_root="${smoke_root}/install"
          cmake --install "${smoke_root}/cpp-build" --prefix "${install_root}"

          # Keep the consumer translation unit private to this workflow: the
          # public header-only package stays lean while the archive job checks
          # that an installed C++20 package is usable by downstream CMake.
          consumer_root="${smoke_root}/consumer"
          mkdir -p "${consumer_root}"
          cat > "${consumer_root}/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.25)
          project(openkache_client_cpp_consumer LANGUAGES CXX)
          find_package(OpenKacheClient CONFIG REQUIRED)
          add_executable(openkache_client_cpp_consumer smoke.cpp)
          target_link_libraries(openkache_client_cpp_consumer PRIVATE OpenKache::Client)
          CMAKE
          cat > "${consumer_root}/smoke.cpp" <<'CPP'
          #include <openkache/client.hpp>

          int main() {
            using Native_Connect = openkache_client_result_t * (*)(
                const std::uint8_t *, std::size_t);
            const Native_Connect native_connect =
                &openkache_client_gate0_connect;
            using Cpp_Connect = openkache::Client (*)(std::string_view);
            const Cpp_Connect cpp_connect = &openkache::Client::connect;
            static_assert(
                static_cast<std::uint32_t>(
                    openkache::Error_Category::Resource_Exhausted) ==
                OPENKACHE_CLIENT_GATE0_ERROR_RESOURCE_EXHAUSTED);
            return native_connect == nullptr || cpp_connect == nullptr;
          }
          CPP
          cmake -S "${consumer_root}" -B "${smoke_root}/consumer-build" \
            -DCMAKE_PREFIX_PATH="${install_root}"
          cmake --build "${smoke_root}/consumer-build"

      - name: Create deterministic C and C++ source archives
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/openkache-cmake-release"
          mkdir -p "${release_root}"
          support_paths=(
            clients/LICENSE
            clients/cmake
            clients/generate.ts
            clients/generator
            clients/model
            clients/api_shape_renderers.ts
            clients/client_contract.ts
            clients/compatibility_ffi_adapters.ts
            clients/compatibility_request_adapters.ts
            clients/compatibility_response_adapters.ts
            clients/compatibility_result_projections.ts
            clients/generator_names.ts
            clients/generator_values.ts
            clients/native_abi_renderers.ts
            clients/operation_client_projection.ts
            clients/operation_models.ts
            clients/operation_plans.ts
            clients/operation_results.ts
            clients/core/include
            protocol
          )
          c_prefix="openkache-client-c-${RELEASE_VERSION}"
          c_archive="${release_root}/${c_prefix}.tar.gz"
          c_tar="${release_root}/${c_prefix}.tar"
          git archive --format=tar --prefix="${c_prefix}/" "${SOURCE_SHA}" \
            clients/c "${support_paths[@]}" > "${c_tar}"
          source_epoch="$(git show -s --format=%ct "${SOURCE_SHA}")"
          tar --append --file="${c_tar}" \
            --mtime="@${source_epoch}" \
            --owner=0 --group=0 --numeric-owner \
            --transform="s,^,${c_prefix}/clients/," \
            -C "${RUNNER_TEMP}/openkache-cmake-notice" \
            THIRD-PARTY-NOTICES.txt
          gzip -n "${c_tar}"
          cpp_prefix="openkache-client-cpp-${RELEASE_VERSION}"
          cpp_archive="${release_root}/${cpp_prefix}.tar.gz"
          cpp_tar="${release_root}/${cpp_prefix}.tar"
          git archive --format=tar --prefix="${cpp_prefix}/" "${SOURCE_SHA}" \
            clients/c clients/cpp "${support_paths[@]}" > "${cpp_tar}"
          tar --append --file="${cpp_tar}" \
            --mtime="@${source_epoch}" \
            --owner=0 --group=0 --numeric-owner \
            --transform="s,^,${cpp_prefix}/clients/," \
            -C "${RUNNER_TEMP}/openkache-cmake-notice" \
            THIRD-PARTY-NOTICES.txt
          gzip -n "${cpp_tar}"
          for archive in "${c_archive}" "${cpp_archive}"; do
            [[ -s "${archive}" ]] || {
              echo "Archive was empty: ${archive}" >&2
              exit 1
            }
            tar -tzf "${archive}" | grep -F "CMakeLists.txt"
            tar -tzf "${archive}" | grep -F "clients/generate.ts"
            tar -tzf "${archive}" | grep -Fx \
              "$(basename "${archive}" .tar.gz)/clients/THIRD-PARTY-NOTICES.txt"
            if tar -tzf "${archive}" | grep -Eq '(^|/)\.git(/|$)'; then
              echo "Archive contains repository metadata." >&2
              exit 1
            fi
          done
          extract_root="${RUNNER_TEMP}/openkache-cmake-archive-extract"
          mkdir -p "${extract_root}"
          native_core="${GITHUB_WORKSPACE}/target/release/libopenkache_client_core.a"
          tar -xzf "${c_archive}" --directory "${extract_root}"
          cmake -S "${extract_root}/${c_prefix}/clients/c" \
            -B "${extract_root}/c-build" \
            -DOPENKACHE_CLIENT_NATIVE_LIBRARY_STATIC="${native_core}"
          cmake --build "${extract_root}/c-build"
          tar -xzf "${cpp_archive}" --directory "${extract_root}"
          cmake -S "${extract_root}/${cpp_prefix}/clients/cpp" \
            -B "${extract_root}/cpp-build" \
            -DOPENKACHE_CLIENT_NATIVE_LIBRARY_STATIC="${native_core}"
          cmake --build "${extract_root}/cpp-build"
          extracted_install="${extract_root}/cpp-install"
          cmake --install "${extract_root}/cpp-build" \
            --prefix "${extracted_install}"
          test -s \
            "${extracted_install}/share/doc/OpenKacheClient/THIRD-PARTY-NOTICES.txt"
          cmake -S "${RUNNER_TEMP}/openkache-cmake-smoke/consumer" \
            -B "${extract_root}/consumer-build" \
            -DCMAKE_PREFIX_PATH="${extracted_install}"
          cmake --build "${extract_root}/consumer-build"
          printf 'source_commit=%s\nsource_tag=%s\npackage_version=%s\narchive_set=c-and-cpp-cmake\n' \
            "${SOURCE_SHA}" "${SOURCE_REF_NAME}" "${RELEASE_VERSION}" \
            > "${release_root}/RELEASE-METADATA"
          (
            cd "${release_root}"
            sha256sum openkache-client-*.tar.gz > SHA256SUMS
          )

      - name: Upload CMake archives and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openkache-cmake-archives
          path: ${{ runner.temp }}/openkache-cmake-release
          if-no-files-found: error
          retention-days: 90
