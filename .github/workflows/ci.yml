name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: [self-hosted, Linux, openkache-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-smithy-codegen

      - name: Generate Python Smithy contract
        working-directory: clients/python
        run: OPENKACHE_GENERATION_TARGET=python ../../protocol/generate.ts

      - name: Check Python package sources
        run: python -m compileall clients/python/src

      - name: Check Rust build
        run: cargo check --locked
