name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CC: clang
      CXX: clang++
      AR: llvm-ar
      RANLIB: llvm-ranlib
      CMAKE_AR: llvm-ar
      CMAKE_RANLIB: llvm-ranlib
      CMAKE_C_COMPILER: clang
      CMAKE_CXX_COMPILER: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-smithy-codegen

      - name: Check Rust contract snapshots
        run: OPENKACHE_GENERATION_TARGET=rust-snapshots OPENKACHE_GENERATION_CHECK=1 ./clients/generate.ts

      - name: Install Clang/LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm

      - name: Verify Clang toolchain
        run: |
          for tool in clang clang++ llvm-ar llvm-ranlib; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "ERROR: required Clang/LLVM tool is missing: $tool" >&2
              echo "Why: public CI build scripts must not fall back to the host GCC toolchain." >&2
              echo "Fix: install the pinned runner Clang/LLVM toolchain before running this workflow." >&2
              exit 1
            fi
          done
          clang --version

      - name: Generate Python Smithy contract
        working-directory: clients/python
        run: OPENKACHE_GENERATION_TARGET=python ../generate.ts

      - name: Check Python package sources
        run: python -m compileall clients/python/src

      - name: Check Rust build
        run: cargo check --locked

  typescript:
    name: TypeScript client
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      AR: llvm-ar
      RANLIB: llvm-ranlib
      CMAKE_AR: llvm-ar
      CMAKE_RANLIB: llvm-ranlib
      CMAKE_C_COMPILER: clang
      CMAKE_CXX_COMPILER: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-smithy-codegen

      - name: Install Clang/LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm

      - name: Verify Clang toolchain
        run: |
          for tool in clang clang++ llvm-ar llvm-ranlib; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "ERROR: required Clang/LLVM tool is missing: $tool" >&2
              echo "Why: the TypeScript native adapter must build with the pinned C toolchain." >&2
              echo "Fix: install the Clang/LLVM toolchain before running the native build." >&2
              exit 1
            fi
          done
          clang --version

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install cargo-zigbuild for Linux
        run: cargo install cargo-zigbuild --locked --version 0.23.0

      - name: Install Zig for Linux
        shell: bash
        env:
          ZIG_VERSION: 0.16.0
          ZIG_ARCHIVE_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/zig.tar.xz"
          destination="${RUNNER_TEMP}/zig"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            --output "${archive}"
          printf '%s  %s\n' "${ZIG_ARCHIVE_SHA256}" "${archive}" | sha256sum --check
          mkdir -p "${destination}"
          tar -xJf "${archive}" --directory "${destination}" --strip-components=1
          "${destination}/zig" version
          printf '%s\n' "${destination}" >> "${GITHUB_PATH}"

      - name: Install TypeScript package dependencies
        working-directory: clients/typescript
        run: bun install --frozen-lockfile

      - name: Generate TypeScript contract
        working-directory: clients/typescript
        run: bun run generate

      - name: Build TypeScript package
        working-directory: clients/typescript
        run: bun run build

      - name: Type-check TypeScript package
        working-directory: clients/typescript
        run: bun run typecheck

      - name: Build TypeScript native adapters
        working-directory: clients/typescript
        run: bun run build:native

  macos-server-package:
    name: Apple Silicon Homebrew smoke test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-smithy-codegen

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Test and build the Apple Silicon server package
        run: |
          set -euo pipefail
          cargo test --locked --package openkache-server
          cargo build \
            --locked \
            --release \
            --target aarch64-apple-darwin \
            --package openkache-server \
            --bin openkache-server \
            --package openkache-cli \
            --bin openkache-cli

      - name: Install with Homebrew and run client-server smoke test
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          version="$(
            cargo metadata \
              --manifest-path server/Cargo.toml \
              --locked \
              --no-deps \
              --format-version 1 \
              | jq -r '.packages[] | select(.name == "openkache-server") | .version'
          )"
          package_root="${RUNNER_TEMP}/openkache-server-${version}-macos-arm64"
          archive="${RUNNER_TEMP}/openkache-server-${version}-macos-arm64.tar.gz"
          mkdir -p "${package_root}"
          install -m 0755 \
            target/aarch64-apple-darwin/release/openkache-server \
            "${package_root}/openkache-server"
          install -m 0755 \
            target/aarch64-apple-darwin/release/openkache-cli \
            "${package_root}/openkache-cli"
          tar -C "${RUNNER_TEMP}" -czf "${archive}" "$(basename "${package_root}")"
          archive_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          formula="${RUNNER_TEMP}/openkache.rb"
          packaging/homebrew/render-formula.sh \
            "${version}" \
            "file://${archive}" \
            "${archive_sha256}" \
            "${formula}"
          brew install --formula --build-from-source "${formula}"
          brew test openkache
          brew uninstall --formula openkache
