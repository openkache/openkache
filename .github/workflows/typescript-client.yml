name: TypeScript client

on:
  push:
    branches: [main]
    paths:
      - "clients/rust/**"
      - "clients/typescript/**"
  pull_request:
    paths:
      - "clients/rust/**"
      - "clients/typescript/**"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install Rust target
        run: rustup target add x86_64-unknown-linux-musl

      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Install build dependencies
        run: bun install --cwd clients/typescript --frozen-lockfile

      - name: Typecheck package
        run: bun run --cwd clients/typescript typecheck

      - name: Build and inspect package
        run: bun run --cwd clients/typescript pack:check
