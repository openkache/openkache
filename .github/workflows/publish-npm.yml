name: Publish TypeScript package

# Keep the complete release definition in-tree without executing it on
# GitHub-hosted runners. Enable this only after an approved customer runner
# and the required npm credentials are provisioned.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-typescript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux native adapters
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-smithy-codegen

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: mlugg/setup-zig@aa9ad5c14eb3452e235a441c4f9a8e89f20d97bd # v2.0.0
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version 0.23.0

      - name: Build package JavaScript and Linux adapters
        working-directory: clients/typescript
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run build:native

      - name: Stage Linux release artifacts
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/openkache-typescript-linux"
          mkdir -p "${release_root}/dist" "${release_root}/target/native"
          cp -R clients/typescript/dist/. "${release_root}/dist/"
          cp clients/typescript/target/native/openkache-client.linux-*.node \
            "${release_root}/target/native/"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openkache-typescript-linux
          path: ${{ runner.temp }}/openkache-typescript-linux
          if-no-files-found: error
          retention-days: 7

  build-darwin:
    name: Build Apple Silicon native adapter
    if: ${{ false }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build Apple Silicon adapter
        working-directory: clients/typescript
        run: bun run build:native

      - name: Stage Apple Silicon release artifact
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/openkache-typescript-darwin"
          mkdir -p "${release_root}/target/native"
          cp clients/typescript/target/native/openkache-client.darwin-arm64.node \
            "${release_root}/target/native/"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openkache-typescript-darwin
          path: ${{ runner.temp }}/openkache-typescript-darwin
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish @openkache/client
    if: ${{ false }}
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-24.04
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openkache-typescript-linux
          path: ${{ runner.temp }}/openkache-typescript-linux

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openkache-typescript-darwin
          path: ${{ runner.temp }}/openkache-typescript-darwin

      - name: Assemble and publish one package
        working-directory: clients/typescript
        env:
          OPENKACHE_RELEASE_ARTIFACTS_READY: "1"
        run: |
          set -euo pipefail
          mkdir -p dist target/native
          cp -R "${RUNNER_TEMP}/openkache-typescript-linux/dist/." dist/
          cp "${RUNNER_TEMP}/openkache-typescript-linux/target/native/"*.node \
            target/native/
          cp "${RUNNER_TEMP}/openkache-typescript-darwin/target/native/"*.node \
            target/native/
          bun install --frozen-lockfile
          bun run release:publish
