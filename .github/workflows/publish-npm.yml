name: Release TypeScript npm package

# Releases are deliberately manual. Dispatch this workflow from the exact
# typescript-v<version> tag only after the protected npm-release environment
# has approved the run. Configure npm Trusted Publishing for the openkache
# package with organization openkache, repository openkache, workflow filename
# publish-npm.yml, and environment npm-release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable package version in clients/typescript/package.json"
        required: true
        type: string
      confirm:
        description: 'Type RELEASE to build and publish this immutable version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-typescript-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CONFIRM: ${{ inputs.confirm }}

jobs:
  guard:
    name: Verify tag, version, and clean source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject an unconfirmed or mismatched release
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_CONFIRM}" != "RELEASE" ]]; then
            echo "The confirmation input must be exactly RELEASE." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be a stable three-part SemVer value." >&2
            exit 1
          fi
          expected_tag="typescript-v${RELEASE_VERSION}"
          if [[ "${SOURCE_REF_TYPE}" != "tag" || "${SOURCE_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Dispatch this workflow from ${expected_tag}; got ${SOURCE_REF_TYPE}:${SOURCE_REF_NAME}." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${expected_tag}^{commit}")" != "${SOURCE_SHA}" ]]; then
            echo "The selected tag does not resolve to the workflow commit." >&2
            exit 1
          fi
          if [[ "$(jq -r '.version' clients/typescript/package.json)" != "${RELEASE_VERSION}" ]]; then
            echo "package.json version does not match the release input." >&2
            exit 1
          fi
          if ! npm_status="$(
            curl --silent --show-error --location --retry 2 --retry-all-errors \
              --user-agent "openkache-release/${RELEASE_VERSION}" \
              --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/openkache/${RELEASE_VERSION}"
          )"; then
            echo "Could not query npm for openkache@${RELEASE_VERSION}." >&2
            echo "Why: npm versions are immutable and publication cannot safely continue without proving this version is unused." >&2
            echo "Fix: restore npm registry access, then rerun the release guard." >&2
            exit 1
          fi
          case "${npm_status}" in
            404)
              ;;
            200)
              echo "openkache@${RELEASE_VERSION} already exists on npm." >&2
              echo "Why: npm versions are immutable and cannot be overwritten." >&2
              echo "Fix: choose the next unused version, update package.json and its typescript-v<version> tag, then rerun the workflow." >&2
              exit 1
              ;;
            *)
              echo "npm returned HTTP ${npm_status} while checking openkache@${RELEASE_VERSION}." >&2
              echo "Why: the release guard could not prove that the immutable version is available." >&2
              echo "Fix: investigate npm registry access and rerun the workflow; do not bypass this guard." >&2
              exit 1
              ;;
          esac
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "The release checkout is dirty; refusing to continue." >&2
            exit 1
          fi

  build-typescript:
    name: Build TypeScript declarations and JavaScript
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-smithy-codegen

      - name: Build and type-check the package
        working-directory: clients/typescript
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          bun run typecheck

      - name: Stage and checksum JavaScript outputs
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/openkache-typescript-dist"
          mkdir -p "${release_root}/dist"
          cp -R clients/typescript/dist/. "${release_root}/dist/"
          printf 'source_commit=%s\nsource_tag=%s\npackage_version=%s\n' \
            "${SOURCE_SHA}" "${SOURCE_REF_NAME}" "${RELEASE_VERSION}" \
            > "${release_root}/RELEASE-METADATA"
          (
            cd "${release_root}"
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload JavaScript artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openkache-typescript-dist
          path: ${{ runner.temp }}/openkache-typescript-dist
          if-no-files-found: error
          retention-days: 14

  build-native:
    name: Build ${{ matrix.name }} native adapter
    needs: guard
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            artifact: openkache-client.linux-x64-gnu.node
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04
            artifact: openkache-client.linux-arm64-gnu.node
            target: aarch64-unknown-linux-gnu
          - name: darwin-arm64
            runner: macos-15
            artifact: openkache-client.darwin-arm64.node
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-smithy-codegen

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ startsWith(matrix.name, 'linux-') && 'x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu' || matrix.target }}

      - name: Install cargo-zigbuild for Linux
        if: startsWith(matrix.name, 'linux-')
        run: cargo install cargo-zigbuild --locked --version 0.23.0

      - name: Install Zig for Linux
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        env:
          ZIG_VERSION: 0.16.0
          ZIG_ARCHIVE_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/zig.tar.xz"
          destination="${RUNNER_TEMP}/zig"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            --output "${archive}"
          printf '%s  %s\n' "${ZIG_ARCHIVE_SHA256}" "${archive}" | sha256sum --check
          mkdir -p "${destination}"
          tar -xJf "${archive}" --directory "${destination}" --strip-components=1
          "${destination}/zig" version
          printf '%s\n' "${destination}" >> "${GITHUB_PATH}"

      - name: Build native adapters
        working-directory: clients/typescript
        run: bun run build:native

      - name: Stage and checksum native adapter
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          NATIVE_ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          source_path="clients/typescript/target/native/${NATIVE_ARTIFACT}"
          if [[ ! -s "${source_path}" ]]; then
            echo "Native build did not produce ${NATIVE_ARTIFACT}." >&2
            exit 1
          fi
          release_root="${RUNNER_TEMP}/openkache-typescript-native-${{ matrix.name }}"
          mkdir -p "${release_root}/target/native"
          cp "${source_path}" "${release_root}/target/native/"
          printf 'source_commit=%s\nsource_tag=%s\npackage_version=%s\nnative_artifact=%s\n' \
            "${SOURCE_SHA}" "${SOURCE_REF_NAME}" "${RELEASE_VERSION}" "${NATIVE_ARTIFACT}" \
            > "${release_root}/RELEASE-METADATA"
          (
            cd "${release_root}"
            if [[ "${RUNNER_OS}" == "macOS" ]]; then
              shasum -a 256 "target/native/${NATIVE_ARTIFACT}" > SHA256SUMS
            else
              sha256sum "target/native/${NATIVE_ARTIFACT}" > SHA256SUMS
            fi
          )

      - name: Upload native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openkache-typescript-native-${{ matrix.name }}
          path: ${{ runner.temp }}/openkache-typescript-native-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable npm version
    needs: [guard, build-typescript, build-native]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    env:
      OPENKACHE_RELEASE_ARTIFACTS_READY: "1"
      OPENKACHE_NPM_CLI: "npm"
      OPENKACHE_TRUSTED_PUBLISHING: "1"
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Download JavaScript and native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: openkache-typescript-*
          path: ${{ runner.temp }}/openkache-typescript-release
          merge-multiple: false

      - name: Verify provenance, checksums, and complete package outputs
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/openkache-typescript-release"
          for artifact in \
            openkache-typescript-dist \
            openkache-typescript-native-linux-x64 \
            openkache-typescript-native-linux-arm64 \
            openkache-typescript-native-darwin-arm64; do
            artifact_root="${release_root}/${artifact}"
            [[ -s "${artifact_root}/RELEASE-METADATA" ]] || {
              echo "Missing provenance metadata for ${artifact}." >&2
              exit 1
            }
            grep -Fx "source_commit=${SOURCE_SHA}" "${artifact_root}/RELEASE-METADATA"
            grep -Fx "source_tag=${SOURCE_REF_NAME}" "${artifact_root}/RELEASE-METADATA"
            grep -Fx "package_version=${RELEASE_VERSION}" "${artifact_root}/RELEASE-METADATA"
            (
              cd "${artifact_root}"
              sha256sum --check SHA256SUMS
            )
          done
          mkdir -p clients/typescript/dist clients/typescript/target/native
          cp -R "${release_root}/openkache-typescript-dist/dist/." clients/typescript/dist/
          for native_root in \
            openkache-typescript-native-linux-x64 \
            openkache-typescript-native-linux-arm64 \
            openkache-typescript-native-darwin-arm64; do
            cp "${release_root}/${native_root}/target/native/"*.node \
              clients/typescript/target/native/
          done
          expected=(
            openkache-client.linux-x64-gnu.node
            openkache-client.linux-arm64-gnu.node
            openkache-client.darwin-arm64.node
          )
          for artifact in "${expected[@]}"; do
            [[ -s "clients/typescript/target/native/${artifact}" ]] || {
              echo "Missing assembled native adapter ${artifact}." >&2
              exit 1
            }
          done
          if [[ "$(find clients/typescript/target/native -maxdepth 1 -type f -name '*.node' | wc -l)" -ne 3 ]]; then
            echo "The assembled package contains an unexpected native adapter set." >&2
            exit 1
          fi
          if [[ -n "$(git diff -- clients/typescript)" ]]; then
            echo "Artifact assembly modified tracked package files." >&2
            exit 1
          fi

      - name: Install dependencies and run release preflight
        working-directory: clients/typescript
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run release:verify

      - name: Smoke-test package archive and close retry
        working-directory: clients/typescript
        run: bun run release:smoke

      - name: Publish to npm
        working-directory: clients/typescript
        run: bun run release:publish
