name: Publish npm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clients/rust/**"
      - "clients/typescript/**"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Install build dependencies
        run: bun install --cwd clients/typescript --frozen-lockfile

      - name: Typecheck and publish package
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_CONFIG_TOKEN" ]; then
            echo "::error title=Missing npm token::Add the NPM_TOKEN repository Actions secret, then rerun this workflow."
            exit 1
          fi
          bun run --cwd clients/typescript typecheck
          bun publish --cwd clients/typescript --access public --tolerate-republish
