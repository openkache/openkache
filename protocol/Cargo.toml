[package]
name = "openkache-protocol"
version = "0.1.0"
edition.workspace = true
description = "Wire protocol types and codecs for OpenKache"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/openkache/openkache"
homepage = "https://openkache.com"
documentation = "https://docs.rs/openkache-protocol"
keywords = ["cache", "protocol", "quic", "openkache"]
categories = ["network-programming", "encoding"]
rust-version = "1.85"
include = [
    "Cargo.toml",
    "*.md",
    "LICENSE",
    "build.rs",
    "src/**/*.rs",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
crossbeam-queue = "*"
smallvec = { version = "*", features = ["const_new"] }
thiserror = "*"
vu128 = "*"
