[package]
name = "openkache"
version = "0.1.0"
edition = "2024"

[features]
# Forces the portable lookup paths for cross-architecture benchmarking.
force-scalar = []

[dependencies]
compio = { version = "*", default-features = false, features = ["fs", "io-uring", "runtime", "time"] }
flume = "*"
futures-util = "*"
serde = { version = "*", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "*"
libc = "*"
toml = "*"
