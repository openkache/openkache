[package]
name = "openkache"
version = "0.1.0"
edition.workspace = true
license = "AGPL-3.0-or-later"

[features]
default = [
    "allocator-jemalloc",
    "channel-kanal",
    "network-runtime-compio",
    "quic-noq",
    "storage-runtime-compio",
]
# Forces the portable lookup paths for cross-architecture benchmarking.
force-scalar = []
allocator-system = []
allocator-mimalloc = ["dep:mimalloc"]
allocator-jemalloc = ["dep:tikv-jemallocator"]
allocator-snmalloc = ["dep:snmalloc-rs"]
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
]
channel-crossfire = ["dep:crossfire"]
channel-flume = ["dep:flume"]
channel-kanal = ["dep:event-listener", "dep:kanal"]
storage-runtime-compio = ["dep:compio"]
storage-runtime-kimojio = ["dep:kimojio"]
storage-runtime-monoio = ["dep:monoio"]
storage-runtime-simulated = ["dep:compio"]
network-runtime-compio = ["dep:compio"]
network-runtime-monoio = ["dep:monoio", "dep:signal-hook"]
network-runtime-glommio = ["dep:glommio", "dep:signal-hook"]
network-runtime-kimojio = ["dep:kimojio", "dep:rustix", "dep:signal-hook"]
quic-quinn = ["dep:compio-quic"]
quic-noq = ["dep:comnoq"]
quic-quiche = ["dep:boring", "dep:quiche"]

[[bin]]
name = "openkache-server"
path = "src/bin/openkache_server.rs"

[dependencies]
aes = "*"
# Both crates must resolve to one BoringSSL binding version.
boring = { version = "*", optional = true }
clap = { version = "*", features = ["derive"] }
comnoq = { version = "*", default-features = false, features = ["ring"], optional = true }
compio = { version = "*", default-features = false, features = ["fs", "io-uring", "net", "polling", "runtime", "signal", "time"], optional = true }
compio-quic = { version = "*", features = ["ring"], optional = true }
crc32fast = "*"
crossfire = { version = "*", optional = true }
event-listener = { version = "*", optional = true }
flume = { version = "*", optional = true }
futures-util = "*"
kanal = { version = "*", optional = true }
kimojio = { version = "*", default-features = false, optional = true }
libc = "*"
glommio = { version = "*", optional = true }
mimalloc = { version = "*", optional = true }
monoio = { version = "*", default-features = false, features = ["async-cancel", "iouring", "sync"], optional = true }
openkache-protocol = { path = "../protocol" }
opentelemetry = { version = "*", optional = true, default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "*", optional = true, default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "*", optional = true, default-features = false, features = ["metrics"] }
quiche = { version = "*", default-features = false, features = ["boringssl-boring-crate"], optional = true }
rand = "*"
rcgen = { version = "*", features = ["x509-parser"] }
rustls = { version = "*", default-features = false, features = ["ring", "std"] }
rustix = { version = "*", default-features = false, features = ["io_uring"], optional = true }
serde = { version = "*", features = ["derive"] }
sha2 = "*"
signal-hook = { version = "*", optional = true }
smallvec = "*"
snmalloc-rs = { version = "*", optional = true, default-features = false, features = ["build_cc", "usewait-on-address"] }
socket2 = { version = "*", features = ["all"] }
thiserror = "*"
tikv-jemallocator = { version = "*", optional = true }
time = "*"
toml = "*"
tracing = "*"
tracing-subscriber = { version = "*", default-features = false, features = ["fmt", "json"] }
