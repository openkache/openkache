[package]
name = "openkache-server"
version = "0.1.1"
edition.workspace = true
description = "SSD-backed cache server with RESP/TCP and native OpenKache/QUIC frontends"
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/openkache/openkache"
homepage = "https://openkache.com"
keywords = ["cache", "server", "quic", "resp", "openkache"]
categories = ["database", "network-programming"]
rust-version = "1.85"
publish = false

[[bin]]
name = "openkache-server"
path = "src/main.rs"

[features]
default = []
alloc-mimalloc = ["dep:mimalloc"]
alloc-jemalloc = ["dep:tikv-jemallocator"]
uring-single-issuer = []
uring-coop-taskrun = []
uring-defer-taskrun = []

[dependencies]
blake3 = "*"
compio = { version = "*", features = ["fs"] }
# Cargo.lock retains the tested release that provides the required registration API.
libc = "*"
mimalloc = { version = "*", optional = true }
openkache-protocol = { version = "*", path = "../protocol" }
quinn = { version = "*", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = "*"
rustls = { version = "*", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
serde = { version = "*", features = ["derive"] }
slab = "*"
toml = "*"
tikv-jemallocator = { version = "*", optional = true }
tokio = { version = "*", features = ["io-util", "net", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "*"
